name: validate

on:
  pull_request:
    paths:
      - "index.toml"
      - "scripts/validate.py"
      - ".github/workflows/validate.yml"
  push:
    branches: [main]
    paths:
      - "index.toml"
      - "scripts/validate.py"

jobs:
  validate:
    name: Validate registry entries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run validator
        run: python scripts/validate.py

      # Comment on the PR if validation fails. (Re-runs on every push.)
      - name: Comment on failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: [
                "❌ `index.toml` failed validation.",
                "",
                "See the [workflow log](" + context.serverUrl + "/" +
                  context.repo.owner + "/" + context.repo.repo +
                  "/actions/runs/" + context.runId + ") for details.",
                "",
                "Common fixes:",
                "- name must match `[a-zA-Z][a-zA-Z0-9_-]*`",
                "- value must be `host/owner/repo[@ref]` (host = github.com / gitlab.com / bitbucket.org)",
                "- the referenced repo must exist and have a `quirk.toml`",
                "- the manifest's `name` field must equal the registry key"
              ].join("\n")
            })
