# Quirk package registry — short name → git source.
#
# To add a package, open a PR adding a line below. Format:
#   <name> = "github.com/<owner>/<repo>"
# Optionally pin a default version with @<tag>.

process = "github.com/AlexVachon/quirk-process"
slug = "github.com/AlexVachon/slug"
logger = "github.com/AlexVachon/logger"
typing = "github.com/AlexVachon/quirk-typing"
